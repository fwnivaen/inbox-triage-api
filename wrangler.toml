name = "inbox-triage-api"
main = "src/index.ts"
compatibility_date = "2026-11-02"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Workers AI binding — used to generate the one-sentence summary and
# suggested_reply draft. Labeling/priority/privacy are deterministic rule
# code (src/classifier.ts, src/priority.ts, src/privacy.ts) and never need AI.
[ai]
binding = "AI"

# Stores per-account Gmail refresh tokens (never the full token in plaintext
# logs), short-lived OAuth state nonces, classified-email metadata with a
# 90-day TTL (SPEC.md §5 retention), and the latest combined digest. Never
# stores full message bodies or full email addresses — see src/gmail/*.
[[kv_namespaces]]
binding = "INBOX_KV"
id = "4446b37cc2ba4e8f93996bd03a986edc"

# Daily multi-account Gmail sync + digest (see src/scheduled.ts). Time is UTC;
# 13:00 UTC = 8am EST / 9am EDT. Adjust to taste.
[triggers]
crons = ["0 13 * * *"]

# Non-secret config. GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are set via
# `wrangler secret put` — never here, never in source.
[vars]
WORKER_BASE_URL = "https://inbox-triage-api.inbox-triage-api.workers.dev"
