name = "inbox-triage-api"
main = "src/index.ts"
compatibility_date = "2026-11-02"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Workers AI binding — used to generate the one-sentence summary and
# suggested_reply draft. Labeling/priority/privacy are deterministic rule
# code (src/classifier.ts, src/priority.ts, src/privacy.ts) and never need AI.
[ai]
binding = "AI"

# No KV/D1 binding yet: classify + digest ship as pure request/response
# endpoints with no persistence. See README.md "Deploying" for what to add
# once a scheduled Gmail-polling job needs retained state.
